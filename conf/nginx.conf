location / {

  proxy_pass http://127.0.0.1:__PORT__;
  include proxy_params_no_auth;
  proxy_redirect off;

  # Attachments are limited to 100 MB by Rowflare
  client_max_body_size 100M;
}

# Real-time collaboration: one WebSocket per open base, idle between edits
location ~ ^/api/bases/[^/]+/ws$ {

  proxy_pass http://127.0.0.1:__PORT__;
  include proxy_params_no_auth;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}
